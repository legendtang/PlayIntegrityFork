name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, maintenance/x86]
    paths-ignore: '**.md'
  pull_request:
    branches: [main, maintenance/x86]
    paths-ignore: '**.md'

jobs:
  build:

    runs-on: macos-26

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check offline property trace analysis
      run: python3 -m unittest discover -s tests -p 'test_*.py'

    - name: Build with Gradle
      run: ./gradlew --warning-mode all assembleRelease

    - name: Verify module architectures and contents
      run: >-
        python3 tools/verify-module.py out/PlayIntegrityFork.zip
        --abi armeabi-v7a --abi arm64-v8a --abi x86 --abi x86_64

    - name: Upload verified module zip
      uses: actions/upload-artifact@v7
      with:
        name: PlayIntegrityFork-CI_#${{ github.run_number }}
        path: 'out/PlayIntegrityFork.zip'
        compression-level: 0
